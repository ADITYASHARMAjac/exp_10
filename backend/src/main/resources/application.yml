server:
  port: 8080

spring:
  application:
    name: tournament-management-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/tournament_db}
      auto-index-creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.tournament: INFO
    org.springframework.data.mongodb.core.MongoTemplate: INFO
