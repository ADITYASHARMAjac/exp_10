      { id: "p11", tournamentId: "tour-102", name: "Manchester Storm", email: "manc@fc.com", seed: 2, wins: 1, losses: 1, draws: 0, points: 3, scoreFor: 3, scoreAgainst: 3, matchesPlayed: 2 },

    const DEMO_MATCHES = [
      {
        id: "m1", tournamentId: "tour-101", round: 1, matchNumber: 1, roundName: "Quarter-Finals",
        participant1Id: "p1", participant1Name: "Sentinels Prime", score1: 2,
        participant2Id: "p8", participant2Name: "Leviatán Apex", score2: 0,

      },
      {

        winnerId: "p2", winnerName: "Fnatic Legion", status: "COMPLETED", nextMatchId: "m6", nextMatchSlot: 1
      },
      {
        id: "m4", tournamentId: "tour-101", round: 1, matchNumber: 4, roundName: "Quarter-Finals",
        participant1Id: "p3", participant1Name: "Paper Rex Elite", score1: null,
        participant2Id: "p6", participant2Name: "Team Liquid", score2: null,
        winnerId: null, winnerName: null, status: "SCHEDULED", nextMatchId: "m6", nextMatchSlot: 2
      },
      {
        id: "m5", tournamentId: "tour-101", round: 2, matchNumber: 1, roundName: "Semi-Finals",
        participant1Id: "p1", participant1Name: "Sentinels Prime", score1: null,
        participant2Id: null, participant2Name: "TBD", score2: null,
        winnerId: null, winnerName: null, status: "SCHEDULED", nextMatchId: "m7", nextMatchSlot: 1
      },
      {
        id: "m6", tournamentId: "tour-101", round: 2, matchNumber: 2, roundName: "Semi-Finals",
        participant1Id: "p2", participant1Name: "Fnatic Legion", score1: null,
        participant2Id: null, participant2Name: "TBD", score2: null,
        winnerId: null, winnerName: null, status: "SCHEDULED", nextMatchId: "m7", nextMatchSlot: 2
      },
      {
        id: "m7", tournamentId: "tour-101", round: 3, matchNumber: 1, roundName: "Final",
        participant1Id: null, participant1Name: "TBD", score1: null,
        participant2Id: null, participant2Name: "TBD", score2: null,
        winnerId: null, winnerName: null, status: "SCHEDULED", nextMatchId: null, nextMatchSlot: null
      }
    ];

    function App() {
      const [tournaments, setTournaments] = useState(() => {
        const saved = localStorage.getItem('arenapulse_t');
        return saved ? JSON.parse(saved) : DEMO_TOURNAMENTS;
      });
      const [participants, setParticipants] = useState(() => {
        const saved = localStorage.getItem('arenapulse_p');
        return saved ? JSON.parse(saved) : DEMO_PARTICIPANTS;
      });
      const [matches, setMatches] = useState(() => {
        const saved = localStorage.getItem('arenapulse_m');
        return saved ? JSON.parse(saved) : DEMO_MATCHES;
      });

      const [view, setView] = useState('dashboard'); // 'dashboard', 'tournaments', 'detail'
      const [selectedTourId, setSelectedTourId] = useState(null);
      const [search, setSearch] = useState('');
      const [statusFilter, setStatusFilter] = useState('');

      // Modals
      const [modalOpen, setModalOpen] = useState(false);
      const [editingTour, setEditingTour] = useState(null);
      const [deletingTour, setDeletingTour] = useState(null);
      const [scoringMatch, setScoringMatch] = useState(null);
      const [addPartModal, setAddPartModal] = useState(false);

      // Save to localStorage
      useEffect(() => {
        localStorage.setItem('arenapulse_t', JSON.stringify(tournaments));
      }, [tournaments]);
      useEffect(() => {
        localStorage.setItem('arenapulse_p', JSON.stringify(participants));
      }, [participants]);
      useEffect(() => {
        localStorage.setItem('arenapulse_m', JSON.stringify(matches));
      }, [matches]);

      const selectedTour = tournaments.find(t => t.id === selectedTourId);
      const currentParticipants = participants.filter(p => p.tournamentId === selectedTourId);
      const currentMatches = matches.filter(m => m.tournamentId === selectedTourId);

      // Reset Demo Data
      const handleResetDemo = () => {
        setTournaments(DEMO_TOURNAMENTS);
        setParticipants(DEMO_PARTICIPANTS);
        setMatches(DEMO_MATCHES);
      };

      // Create / Edit Tournament
      const handleSaveTournament = (data) => {
        if (editingTour) {
          setTournaments(prev => prev.map(t => t.id === editingTour.id ? { ...t, ...data } : t));
        } else {
          const newT = {
            ...data,
            id: 'tour-' + Date.now(),
            currentParticipantsCount: 0
          };
          setTournaments(prev => [newT, ...prev]);
        }
        setModalOpen(false);
        setEditingTour(null);
      };

      // Delete Tournament
      const handleDeleteTournament = (id) => {
        setTournaments(prev => prev.filter(t => t.id !== id));
        setParticipants(prev => prev.filter(p => p.tournamentId !== id));
        setMatches(prev => prev.filter(m => m.tournamentId !== id));
        setDeletingTour(null);
        if (selectedTourId === id) {
          setView('tournaments');
          setSelectedTourId(null);
        }
      };

      // Add Participant
      const handleAddParticipant = (pData) => {
        const newPart = {
          ...pData,
          id: 'p-' + Date.now(),
          tournamentId: selectedTourId,
          seed: currentParticipants.length + 1,
          matchesPlayed: 0, wins: 0, losses: 0, draws: 0, points: 0, scoreFor: 0, scoreAgainst: 0
        };
        setParticipants(prev => [...prev, newPart]);
        setTournaments(prev => prev.map(t => t.id === selectedTourId ? { ...t, currentParticipantsCount: (t.currentParticipantsCount || 0) + 1 } : t));
        setAddPartModal(false);
      };

      // Remove Participant
      const handleRemoveParticipant = (pId) => {
        setParticipants(prev => prev.filter(p => p.id !== pId));
        setTournaments(prev => prev.map(t => t.id === selectedTourId ? { ...t, currentParticipantsCount: Math.max(0, (t.currentParticipantsCount || 1) - 1) } : t));
      };

      // Generate Brackets
      const handleGenerateBrackets = () => {
        if (currentParticipants.length < 2) {
          alert("Add at least 2 participants before generating fixtures.");
          return;
        }
        const newMatches = [
          {
            id: 'gen-m1', tournamentId: selectedTourId, round: 1, matchNumber: 1, roundName: "Semi-Finals",
            participant1Id: currentParticipants[0]?.id, participant1Name: currentParticipants[0]?.name, score1: null,
            participant2Id: currentParticipants[1]?.id, participant2Name: currentParticipants[1]?.name, score2: null,
            winnerId: null, winnerName: null, status: "SCHEDULED", nextMatchId: "gen-m3", nextMatchSlot: 1
          },
          {
            id: 'gen-m2', tournamentId: selectedTourId, round: 1, matchNumber: 2, roundName: "Semi-Finals",
            participant1Id: currentParticipants[2]?.id || null, participant1Name: currentParticipants[2]?.name || "TBD", score1: null,
            participant2Id: currentParticipants[3]?.id || null, participant2Name: currentParticipants[3]?.name || "TBD", score2: null,
            winnerId: null, winnerName: null, status: "SCHEDULED", nextMatchId: "gen-m3", nextMatchSlot: 2
          },
          {
            id: 'gen-m3', tournamentId: selectedTourId, round: 2, matchNumber: 1, roundName: "Final",
            participant1Id: null, participant1Name: "TBD", score1: null,
            participant2Id: null, participant2Name: "TBD", score2: null,
            winnerId: null, winnerName: null, status: "SCHEDULED", nextMatchId: null, nextMatchSlot: null
          }
        ];

        setMatches(prev => [...prev.filter(m => m.tournamentId !== selectedTourId), ...newMatches]);
        setTournaments(prev => prev.map(t => t.id === selectedTourId ? { ...t, status: "ONGOING" } : t));
      };

      // Save Match Score & Advance Winner
      const handleSaveScore = (mId, s1, s2, isCompleted) => {
        setMatches(prev => {
          const updated = [...prev];
          const m = updated.find(x => x.id === mId);
          if (!m) return prev;

          m.score1 = Number(s1);
          m.score2 = Number(s2);
          if (isCompleted) {
            m.status = "COMPLETED";
            if (s1 > s2) {
              m.winnerId = m.participant1Id;
              m.winnerName = m.participant1Name;
            } else if (s2 > s1) {
              m.winnerId = m.participant2Id;
              m.winnerName = m.participant2Name;
            } else {
              m.winnerId = null;
              m.winnerName = "Draw";
            }

            // Propagate winner to next match slot
            if (m.nextMatchId && m.winnerId) {
              const nextM = updated.find(x => x.id === m.nextMatchId);
              if (nextM) {
                if (m.nextMatchSlot === 1) {
                  nextM.participant1Id = m.winnerId;
                  nextM.participant1Name = m.winnerName;
                } else {
                  nextM.participant2Id = m.winnerId;
                  nextM.participant2Name = m.winnerName;
                }
              }
            }
          }
          return updated;
        });
        setScoringMatch(null);
      };

      // Filtered Tournaments
      const filtered = tournaments.filter(t => {
        if (search) {
          const q = search.toLowerCase();
          if (!t.title.toLowerCase().includes(q) && !t.game.toLowerCase().includes(q)) return false;
        }
        if (statusFilter && t.status !== statusFilter) return false;
        return true;
      });

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="sticky top-0 z-40 glass-panel border-b border-slate-800 bg-[#0a0e17]/90 px-6 py-3.5">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div 
                onClick={() => { setView('dashboard'); setSelectedTourId(null); }} 
                className="flex items-center gap-3 cursor-pointer group"
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
                  <TrophyIcon />
                </div>
                <div>
                  <span className="font-extrabold text-xl tracking-tight text-white">Arena<span className="text-indigo-400">Pulse</span></span>
                  <span className="hidden sm:inline-block ml-2 text-[10px] uppercase font-bold text-indigo-300 bg-indigo-950 px-2 py-0.5 rounded-full border border-indigo-800">Spring + MongoDB + React</span>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <nav className="hidden md:flex gap-1 bg-slate-900/60 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
                  <button onClick={() => { setView('dashboard'); setSelectedTourId(null); }} className={`px-3 py-1.5 rounded-lg ${view === 'dashboard' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>Dashboard</button>
                  <button onClick={() => { setView('tournaments'); setSelectedTourId(null); }} className={`px-3 py-1.5 rounded-lg ${view === 'tournaments' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>Tournaments</button>
                </nav>

                <button onClick={handleResetDemo} className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700">
                  <SparklesIcon className="w-3.5 h-3.5 text-indigo-400" />
                  <span className="hidden sm:inline">Reset Demo</span>
                </button>

                <button onClick={() => { setEditingTour(null); setModalOpen(true); }} className="flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-bold rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30">
                  <PlusIcon />
                  <span>Create Tournament</span>
                </button>
              </div>
            </div>
          </header>

          {/* Main Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6 sm:p-8">
            {view === 'dashboard' && (
              <div className="space-y-8">
                {/* Hero */}
                <div className="relative rounded-3xl p-8 bg-gradient-to-r from-indigo-950 via-slate-900 to-slate-900 border border-slate-800">
                  <span className="text-xs uppercase tracking-wider font-bold text-indigo-400 bg-indigo-950/80 px-3 py-1 rounded-full border border-indigo-800">Tournament Command Engine</span>
                  <h1 className="text-3xl font-extrabold text-white mt-3">Ready to Host, Bracket &amp; Score</h1>
                  <p className="text-xs text-slate-300 max-w-xl mt-1.5">Manage sports and esports tournaments with automated brackets, match score propagation, participant rosters, and live standings.</p>
                  <div className="mt-5 flex gap-3">
                    <button onClick={() => { setEditingTour(null); setModalOpen(true); }} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold flex items-center gap-2">
                      <PlusIcon /> Create Tournament
                    </button>
                    <button onClick={() => setView('tournaments')} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold flex items-center gap-2">
                      View Tournaments <ArrowRightIcon />
                    </button>
                  </div>
                </div>

                {/* Stats */}
                <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
                  <div className="glass-card p-5 rounded-2xl border border-slate-800">
                    <p className="text-xs font-semibold uppercase text-slate-400">Tournaments</p>
                    <h3 className="text-3xl font-extrabold text-white mt-1">{tournaments.length}</h3>
                  </div>
                  <div className="glass-card p-5 rounded-2xl border border-slate-800">
                    <p className="text-xs font-semibold uppercase text-slate-400">Live Battles</p>
                    <h3 className="text-3xl font-extrabold text-amber-400 mt-1">{tournaments.filter(t => t.status === 'ONGOING').length}</h3>
                  </div>
                  <div className="glass-card p-5 rounded-2xl border border-slate-800">
                    <p className="text-xs font-semibold uppercase text-slate-400">Registered Teams</p>
                    <h3 className="text-3xl font-extrabold text-emerald-400 mt-1">{participants.length}</h3>
                  </div>
                  <div className="glass-card p-5 rounded-2xl border border-slate-800">
                    <p className="text-xs font-semibold uppercase text-slate-400">Matches Concluded</p>
                    <h3 className="text-3xl font-extrabold text-purple-400 mt-1">{matches.filter(m => m.status === 'COMPLETED').length}</h3>
                  </div>
                </div>

                {/* Live Tournaments */}
                <div>
                  <h2 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <SwordsIcon className="w-5 h-5 text-emerald-400" /> Live Tournaments
                  </h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                    {tournaments.map(t => (
                      <div key={t.id} className="glass-card rounded-2xl overflow-hidden border border-slate-800 flex flex-col justify-between">
                        <div>
                          <img src={t.bannerUrl} alt={t.title} className="w-full h-36 object-cover" />
                          <div className="p-4">
                            <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-800">{t.game}</span>
                            <h3 onClick={() => { setSelectedTourId(t.id); setView('detail'); }} className="text-base font-bold text-white mt-2 cursor-pointer hover:text-indigo-400 truncate">{t.title}</h3>
                            <p className="text-xs text-slate-400 line-clamp-2 mt-1">{t.description}</p>
                            <div className="mt-3 text-xs text-amber-300 font-bold flex items-center gap-1">
                              <AwardIcon /> {t.prizePool}
                            </div>
                          </div>
                        </div>
                        <div className="p-4 pt-0 flex gap-2">
                          <button onClick={() => { setSelectedTourId(t.id); setView('detail'); }} className="flex-1 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1">
                            Manage &amp; Bracket <ArrowRightIcon className="w-3.5 h-3.5" />
                          </button>
                          <button onClick={() => { setEditingTour(t); setModalOpen(true); }} className="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl">
                            <EditIcon className="w-3.5 h-3.5" />
                          </button>
                          <button onClick={() => setDeletingTour(t)} className="p-2 bg-red-950/40 hover:bg-red-900/60 text-red-300 rounded-xl">
                            <TrashIcon className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {view === 'tournaments' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h1 className="text-2xl font-extrabold text-white">All Tournaments ({filtered.length})</h1>
                  <button onClick={() => { setEditingTour(null); setModalOpen(true); }} className="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold flex items-center gap-1.5">
                    <PlusIcon /> New Tournament
                  </button>
                </div>

                {/* Filter */}
                <div className="flex gap-3">
                  <input
                    type="text"
                    value={search}
                    onChange={e => setSearch(e.target.value)}
                    placeholder="Search tournaments by name or game..."
                    className="flex-1 px-4 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white"
                  />
                  <select
                    value={statusFilter}
                    onChange={e => setStatusFilter(e.target.value)}
                    className="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white"
                  >
                    <option value="">All Statuses</option>
                    <option value="UPCOMING">Upcoming</option>
                    <option value="ONGOING">Ongoing</option>
                    <option value="COMPLETED">Completed</option>
                  </select>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                  {filtered.map(t => (
                    <div key={t.id} className="glass-card rounded-2xl overflow-hidden border border-slate-800 flex flex-col justify-between">
                      <div>
                        <img src={t.bannerUrl} alt={t.title} className="w-full h-36 object-cover" />
                        <div className="p-4">
                          <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-800">{t.game}</span>
                          <h3 onClick={() => { setSelectedTourId(t.id); setView('detail'); }} className="text-base font-bold text-white mt-2 cursor-pointer hover:text-indigo-400 truncate">{t.title}</h3>
                          <p className="text-xs text-slate-400 line-clamp-2 mt-1">{t.description}</p>
                          <div className="mt-3 text-xs text-amber-300 font-bold flex items-center gap-1">
                            <AwardIcon /> {t.prizePool}
                          </div>
                        </div>
                      </div>
                      <div className="p-4 pt-0 flex gap-2">
                        <button onClick={() => { setSelectedTourId(t.id); setView('detail'); }} className="flex-1 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1">
                          Manage &amp; Bracket <ArrowRightIcon className="w-3.5 h-3.5" />
                        </button>
                        <button onClick={() => { setEditingTour(t); setModalOpen(true); }} className="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl">
                          <EditIcon className="w-3.5 h-3.5" />
                        </button>
                        <button onClick={() => setDeletingTour(t)} className="p-2 bg-red-950/40 hover:bg-red-900/60 text-red-300 rounded-xl">
                          <TrashIcon className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {view === 'detail' && selectedTour && (
              <div className="space-y-6">
                <button onClick={() => setView('tournaments')} className="text-xs font-semibold text-slate-400 hover:text-white flex items-center gap-1">
                  <ArrowLeftIcon /> Back to Tournaments
                </button>

                {/* Banner */}
                <div className="glass-panel rounded-3xl overflow-hidden border border-slate-800">
                  <div className="relative h-48 bg-slate-900">
                    <img src={selectedTour.bannerUrl} alt={selectedTour.title} className="w-full h-full object-cover" />
                    <div className="absolute inset-0 bg-gradient-to-t from-[#0a0e17] to-transparent" />
                    <div className="absolute bottom-4 left-6 right-6 flex justify-between items-end">
                      <div>
                        <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-indigo-600 text-white">{selectedTour.game}</span>
                        <h1 className="text-2xl font-extrabold text-white mt-1">{selectedTour.title}</h1>
                      </div>
                      <button onClick={handleGenerateBrackets} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-lg">
                        <SparklesIcon /> Generate / Reset Brackets
                      </button>
                    </div>
                  </div>
                  <div className="grid grid-cols-3 divide-x divide-slate-800 border-t border-slate-800 p-3 text-xs bg-slate-900/40 text-center">
                    <div><span className="text-slate-400">Prize Pool:</span> <strong className="text-amber-300">{selectedTour.prizePool}</strong></div>
                    <div><span className="text-slate-400">Location:</span> <strong className="text-white">{selectedTour.location}</strong></div>
                    <div><span className="text-slate-400">Capacity:</span> <strong className="text-white">{currentParticipants.length} / {selectedTour.maxParticipants}</strong></div>
                  </div>
                </div>

                {/* Tabs / Content */}
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  {/* Left 2 Cols: Brackets & Matches */}
                  <div className="lg:col-span-2 space-y-4">
                    <div className="flex justify-between items-center">
                      <h3 className="text-base font-bold text-white flex items-center gap-2">
                        <SwordsIcon className="text-indigo-400" /> Tournament Brackets &amp; Fixtures ({currentMatches.length})
                      </h3>
                      <span className="text-xs text-slate-400">Click any card to enter scores</span>
                    </div>

                    {currentMatches.length > 0 ? (
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {currentMatches.map(m => (
                          <div
                            key={m.id}
                            onClick={() => setScoringMatch(m)}
                            className="glass-card rounded-xl p-4 border border-slate-800 hover:border-indigo-500 cursor-pointer transition-all"
                          >
                            <div className="flex justify-between text-[10px] text-slate-400 mb-2">
                              <span className="font-bold text-indigo-400">{m.roundName} #{m.matchNumber}</span>
                              <span className={m.status === 'COMPLETED' ? 'text-emerald-400 font-bold' : 'text-slate-500'}>
                                {m.status}
                              </span>
                            </div>

                            <div className="space-y-1.5">
                              <div className={`flex justify-between items-center p-2 rounded-lg ${m.winnerId === m.participant1Id && m.status === 'COMPLETED' ? 'bg-indigo-950/80 font-bold text-white border border-indigo-700' : 'bg-slate-900/60 text-slate-300'}`}>
                                <span className="text-xs truncate">{m.participant1Name || 'TBD'}</span>
                                <span className="font-mono text-xs">{m.score1 !== null ? m.score1 : '-'}</span>
                              </div>
                              <div className={`flex justify-between items-center p-2 rounded-lg ${m.winnerId === m.participant2Id && m.status === 'COMPLETED' ? 'bg-indigo-950/80 font-bold text-white border border-indigo-700' : 'bg-slate-900/60 text-slate-300'}`}>
                                <span className="text-xs truncate">{m.participant2Name || 'TBD'}</span>
                                <span className="font-mono text-xs">{m.score2 !== null ? m.score2 : '-'}</span>
                              </div>
                            </div>
                            <div className="mt-2 text-[10px] text-slate-400 flex justify-between items-center">
                              <span>{m.winnerName ? `Winner: ${m.winnerName}` : 'Click to score'}</span>
                              <EditIcon className="w-3 h-3 text-indigo-400" />
                            </div>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <div className="glass-panel p-8 text-center rounded-2xl border border-slate-800">
                        <TrophyIcon className="w-8 h-8 text-slate-600 mx-auto mb-2" />
                        <h4 className="text-sm font-bold text-white">No Fixtures Generated Yet</h4>
                        <p className="text-xs text-slate-400 mt-1">Click "Generate / Reset Brackets" above to generate the tournament tree.</p>
                      </div>
                    )}
                  </div>

                  {/* Right 1 Col: Participants Roster */}
                  <div className="space-y-4">
                    <div className="flex justify-between items-center">
                      <h3 className="text-base font-bold text-white flex items-center gap-2">
                        <UsersIcon className="text-indigo-400" /> Roster ({currentParticipants.length})
                      </h3>
                      <button onClick={() => setAddPartModal(true)} className="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold flex items-center gap-1">
                        <PlusIcon /> Add Team
                      </button>
                    </div>

                    <div className="space-y-2">
                      {currentParticipants.map((p, idx) => (
                        <div key={p.id} className="glass-card p-3 rounded-xl border border-slate-800 flex justify-between items-center">
                          <div className="flex items-center gap-2.5">
                            <span className="w-6 h-6 rounded-lg bg-slate-800 text-indigo-400 text-xs font-mono font-bold flex items-center justify-center">#{p.seed || idx + 1}</span>
                            <div>
                              <p className="text-xs font-bold text-white">{p.name}</p>
                              <p className="text-[10px] text-slate-500">{p.email || 'No email'}</p>
                            </div>
                          </div>
                          <button onClick={() => handleRemoveParticipant(p.id)} className="text-slate-500 hover:text-red-400 p-1">
                            <TrashIcon className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Modal: Create/Edit Tournament */}
          {modalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="glass-panel w-full max-w-lg rounded-2xl border border-slate-700 p-6 space-y-4">
                <h3 className="text-base font-bold text-white">{editingTour ? 'Edit Tournament' : 'Create Tournament'}</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  handleSaveTournament({
                    title: fd.get('title'),
                    game: fd.get('game'),
                    description: fd.get('description'),
                    prizePool: fd.get('prizePool'),
                    location: fd.get('location'),
                    maxParticipants: parseInt(fd.get('maxParticipants')) || 8,
                    status: fd.get('status'),
                    bannerUrl: fd.get('bannerUrl') || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80'
                  });
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Title *</label>
                    <input name="title" defaultValue={editingTour?.title || ''} required className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">Sport / Game *</label>
                      <input name="game" defaultValue={editingTour?.game || 'Valorant'} required className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">Prize Pool</label>
                      <input name="prizePool" defaultValue={editingTour?.prizePool || '$5,000 USD'} className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">Max Capacity</label>
                      <input type="number" name="maxParticipants" defaultValue={editingTour?.maxParticipants || 8} min="2" className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">Status</label>
                      <select name="status" defaultValue={editingTour?.status || 'UPCOMING'} className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white">
                        <option value="UPCOMING">Upcoming</option>
                        <option value="ONGOING">Ongoing</option>
                        <option value="COMPLETED">Completed</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Description</label>
                    <textarea name="description" defaultValue={editingTour?.description || ''} rows={2} className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white" />
                  </div>
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Cover Banner URL</label>
                    <input name="bannerUrl" defaultValue={editingTour?.bannerUrl || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80'} className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white" />
                  </div>
                  <div className="pt-3 flex justify-end gap-2 border-t border-slate-800">
                    <button type="button" onClick={() => setModalOpen(false)} className="px-3 py-2 text-slate-400 hover:text-white">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold">Save</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal: Delete Confirmation */}
          {deletingTour && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="glass-panel w-full max-w-sm rounded-2xl border border-red-900 p-6 space-y-4">
                <h3 className="text-base font-bold text-white">Delete Tournament?</h3>
                <p className="text-xs text-slate-300">Are you sure you want to permanently delete "{deletingTour.title}"? All brackets and participants will be deleted.</p>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setDeletingTour(null)} className="px-3 py-2 text-xs text-slate-400">Cancel</button>
                  <button onClick={() => handleDeleteTournament(deletingTour.id)} className="px-4 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-bold rounded-xl">Delete</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal: Score Match */}
          {scoringMatch && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="glass-panel w-full max-w-sm rounded-2xl border border-slate-700 p-6 space-y-4">
                <h3 className="text-base font-bold text-white">Update Match Result</h3>
                <p className="text-xs text-slate-400">{scoringMatch.roundName} #{scoringMatch.matchNumber}</p>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  handleSaveScore(scoringMatch.id, fd.get('s1'), fd.get('s2'), fd.get('done') === 'on');
                }} className="space-y-4">
                  <div className="grid grid-cols-2 gap-3 text-center">
                    <div>
                      <p className="text-xs font-bold text-white truncate mb-1">{scoringMatch.participant1Name || 'P1'}</p>
                      <input name="s1" type="number" defaultValue={scoringMatch.score1 ?? 0} className="w-16 py-2 bg-slate-800 text-center font-mono font-bold text-xl text-white rounded-xl border border-slate-700" />
                    </div>
                    <div>
                      <p className="text-xs font-bold text-white truncate mb-1">{scoringMatch.participant2Name || 'P2'}</p>
                      <input name="s2" type="number" defaultValue={scoringMatch.score2 ?? 0} className="w-16 py-2 bg-slate-800 text-center font-mono font-bold text-xl text-white rounded-xl border border-slate-700" />
                    </div>
                  </div>

                  <label className="flex items-center gap-2 text-xs text-slate-300">
                    <input type="checkbox" name="done" defaultChecked={true} className="w-4 h-4 rounded text-indigo-600 bg-slate-800" />
                    <span>Conclude match &amp; advance winner</span>
                  </label>

                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button type="button" onClick={() => setScoringMatch(null)} className="px-3 py-1.5 text-xs text-slate-400">Cancel</button>
                    <button type="submit" className="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl">Save Result</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal: Add Team */}
          {addPartModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="glass-panel w-full max-w-sm rounded-2xl border border-slate-700 p-6 space-y-4">
                <h3 className="text-base font-bold text-white">Register Team / Player</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  handleAddParticipant({
                    name: fd.get('name'),
                    email: fd.get('email')
                  });
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Team / Player Name *</label>
                    <input name="name" required placeholder="e.g. Sentinels, Magnus" className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white" />
                  </div>
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Email / Contact</label>
                    <input name="email" type="email" placeholder="contact@team.gg" className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white" />
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button type="button" onClick={() => setAddPartModal(false)} className="px-3 py-1.5 text-slate-400">Cancel</button>
                    <button type="submit" className="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl">Add Team</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
